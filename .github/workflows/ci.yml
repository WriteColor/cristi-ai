name: Validate Cristi
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
